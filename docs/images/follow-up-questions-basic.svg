<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16162a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="20" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Follow-up Questions Component</text>

  <!-- Question buttons -->
  <rect x="20" y="50" width="220" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <circle cx="40" cy="68" r="8" fill="#3b82f6"/>
  <text x="55" y="73" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">Tell me more about this topic</text>

  <rect x="250" y="50" width="200" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <circle cx="270" cy="68" r="8" fill="#3b82f6"/>
  <text x="285" y="73" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">Can you provide an example?</text>

  <rect x="460" y="50" width="120" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <circle cx="480" cy="68" r="8" fill="#3b82f6"/>
  <text x="495" y="73" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">Best practices?</text>

  <!-- Input field -->
  <rect x="20" y="110" width="560" height="50" rx="25" fill="#0a0a14" stroke="#374151" stroke-width="1"/>
  <text x="40" y="140" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">Type a message...</text>

  <!-- Send button -->
  <circle cx="550" cy="135" r="18" fill="#374151"/>
  <path d="M544 135 L556 135 M550 129 L556 135 L550 141" stroke="#9ca3af" stroke-width="2" fill="none"/>

  <!-- Caption -->
  <text x="300" y="185" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Click a suggestion to populate the input field</text>
</svg>
