<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16162a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="url(#bg2)" rx="8"/>

  <!-- Title -->
  <text x="20" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Follow-up Questions with Icons</text>

  <!-- Question buttons with sparkle icons -->
  <rect x="20" y="50" width="200" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <!-- Sparkle icon -->
  <path d="M35 68 L37 63 L39 68 L44 70 L39 72 L37 77 L35 72 L30 70 Z" fill="#60a5fa"/>
  <text x="50" y="73" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">Explain in simpler terms</text>

  <rect x="230" y="50" width="180" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <path d="M245 68 L247 63 L249 68 L254 70 L249 72 L247 77 L245 72 L240 70 Z" fill="#60a5fa"/>
  <text x="260" y="73" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">What are alternatives?</text>

  <rect x="420" y="50" width="160" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <path d="M435 68 L437 63 L439 68 L444 70 L439 72 L437 77 L435 72 L430 70 Z" fill="#60a5fa"/>
  <text x="450" y="73" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">Show code example</text>

  <!-- Input field with populated text -->
  <rect x="20" y="110" width="560" height="50" rx="25" fill="#0a0a14" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="140" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="14">Explain in simpler terms</text>
  <rect x="40" y="127" width="2" height="20" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Send button (active) -->
  <circle cx="550" cy="135" r="18" fill="#3b82f6"/>
  <path d="M544 135 L556 135 M550 129 L556 135 L550 141" stroke="white" stroke-width="2" fill="none"/>

  <!-- Caption -->
  <text x="300" y="185" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">After clicking a suggestion - input is populated and focused</text>
</svg>
