<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16162a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg3)" rx="8"/>

  <!-- Title -->
  <text x="20" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Empty Session with Initial Suggestions</text>

  <!-- Placeholder icon -->
  <circle cx="200" cy="100" r="40" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <text x="200" y="108" fill="#6b7280" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">?</text>

  <!-- Welcome text -->
  <text x="200" y="170" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Welcome! Start a conversation or</text>
  <text x="200" y="190" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">choose one of the suggestions below.</text>

  <!-- Suggestion buttons -->
  <rect x="40" y="220" width="150" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <path d="M55 238 L61 238 M58 232 L64 238 L58 244" stroke="#60a5fa" stroke-width="2" fill="none"/>
  <text x="70" y="243" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">What can you do?</text>

  <rect x="210" y="220" width="150" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <path d="M225 238 L231 238 M228 232 L234 238 L228 244" stroke="#60a5fa" stroke-width="2" fill="none"/>
  <text x="240" y="243" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">Tell me about...</text>

  <rect x="40" y="270" width="150" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <path d="M55 288 L61 288 M58 282 L64 288 L58 294" stroke="#60a5fa" stroke-width="2" fill="none"/>
  <text x="70" y="293" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">How do I get started?</text>

  <rect x="210" y="270" width="150" height="36" rx="18" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <path d="M225 288 L231 288 M228 282 L234 288 L228 294" stroke="#60a5fa" stroke-width="2" fill="none"/>
  <text x="240" y="293" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12">Show examples</text>

  <!-- Input field -->
  <rect x="20" y="330" width="360" height="50" rx="25" fill="#0a0a14" stroke="#374151" stroke-width="1"/>
  <text x="40" y="360" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">Type a message...</text>

  <!-- Send button -->
  <circle cx="355" cy="355" r="18" fill="#374151"/>
  <path d="M349 355 L361 355 M355 349 L361 355 L355 361" stroke="#9ca3af" stroke-width="2" fill="none"/>
</svg>
